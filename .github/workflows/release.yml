name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v0.1.0 (notes are read from .github/release-notes/<version>.md)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest version
        run: |
          MANIFEST=$(jq -r .version custom_components/powerwall3_local/manifest.json)
          if [ "v$MANIFEST" != "${{ inputs.version }}" ]; then
            echo "manifest.json version ($MANIFEST) does not match ${{ inputs.version }}"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" \
            --target "${{ github.sha }}" \
            --title "${{ inputs.version }}" \
            --notes-file ".github/release-notes/${{ inputs.version }}.md"
